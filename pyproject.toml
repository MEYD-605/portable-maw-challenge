[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-workflow-kit"
version = "0.7.0"
description = "Toolkit for orchestrating parallel AI agents."
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
maw = "multi_agent_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
